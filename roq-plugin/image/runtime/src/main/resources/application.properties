# Roq Image Plugin — sensible default presets
# Override or extend in your site's application.properties.

# Hero / banner images
quarkus.qute.image.presets.roq-hero.formats=webp,jpg
quarkus.qute.image.presets.roq-hero.fallback-format=jpg
quarkus.qute.image.presets.roq-hero.widths=400,800,1200
quarkus.qute.image.presets.roq-hero.quality=80

# Post listing thumbnails (3:2 crop)
quarkus.qute.image.presets.roq-post-card.formats=webp,jpg
quarkus.qute.image.presets.roq-post-card.fallback-format=jpg
quarkus.qute.image.presets.roq-post-card.widths=160,320,640
quarkus.qute.image.presets.roq-post-card.crop.ratio=3:2
quarkus.qute.image.presets.roq-post-card.crop.keep=center
quarkus.qute.image.presets.roq-post-card.quality=80

# Avatar / profile photos (square, pixel-ratio mode)
quarkus.qute.image.presets.roq-avatar.formats=webp,jpg
quarkus.qute.image.presets.roq-avatar.fallback-format=jpg
quarkus.qute.image.presets.roq-avatar.widths=48,72,96
quarkus.qute.image.presets.roq-avatar.crop.ratio=1:1
quarkus.qute.image.presets.roq-avatar.crop.keep=center
quarkus.qute.image.presets.roq-avatar.pixel-ratio.base-width=48
quarkus.qute.image.presets.roq-avatar.pixel-ratio.fallback-width=48
quarkus.qute.image.presets.roq-avatar.pixel-ratio.ratios=1,1.5,2
quarkus.qute.image.presets.roq-avatar.quality=80

# General in-content images
quarkus.qute.image.presets.roq-content.formats=webp,jpg
quarkus.qute.image.presets.roq-content.fallback-format=jpg
quarkus.qute.image.presets.roq-content.widths=400,800
quarkus.qute.image.presets.roq-content.quality=85

# Every image is converted at build time: a source the build could not resolve is an error, not a broken <img>
quarkus.qute.image.strict=true

# Social card image (og:image, twitter:image), used by the seoImage tag through img:url(page.image, 'roq-og')
quarkus.qute.image.presets.roq-og.formats=jpg
quarkus.qute.image.presets.roq-og.widths=1200
quarkus.qute.image.presets.roq-og.quality=80
quarkus.qute.image.presets.roq-og.crop.ratio=191:100
quarkus.qute.image.presets.roq-og.crop.keep=center
