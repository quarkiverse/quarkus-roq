- title: Experience
  items:
    - header: "1842 - 1843"
      title: "Mathematician and Writer"
      content: |
        Translated and annotated Luigi Menabrea's paper on Charles
        Babbage's Analytical Engine. Added extensive original notes,
        including the first published algorithm designed for a machine.

        **Key contributions:**
        - Recognized the machine's potential beyond pure calculation
        - Described how the engine could handle letters and symbols
        - Published what is now considered the first computer program

    - header: "1843"
      title: "Notes on the Analytical Engine"
      collapsible: true
      collapsed: true
      content: |
        A set of seven notes, labelled A to G, appended to the translation.
      subItems:
        - header: "Note A"
          title: "Beyond calculation"
          content: |
            The engine could manipulate symbols, not only numbers.
        - header: "Note G"
          title: "Bernoulli numbers algorithm"
          content: |
            Step-by-step method to compute Bernoulli numbers with the engine.

    - header: "1840 - 1842"
