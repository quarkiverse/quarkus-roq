name: "Roq The Code Theme"
description: "A minimal, developer-focused theme for Roq static site generator"
metadata:
  keywords:
    - roq
    - theme
    - website
    - static
    - developer
    - blog
  guide: "https://iamroq.dev/theme/the-code-theme/"
  categories:
    - "web"
  status: "preview"
  config:
    - "site.theme"
  codestart:
    name: "roq-default-theme-codestart"
    extra-names:
      - "roq-project-codestart"
    languages:
      - "java"
      - "kotlin"
      - "scala"
    artifact: "io.quarkiverse.roq:quarkus-roq-theme-default:codestarts:jar:${project.version}"
