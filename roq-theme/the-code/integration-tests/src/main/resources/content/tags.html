---
title: Tags
layout: page
---

{#if site.collections.posts.tagsCount??}
<div class="tag-list">
  {#for tag in site.collections.posts.tagsCount}
  <a href="{=site.url('/posts/tag/')}{=tag.name}" class="tag-badge">
    {=tag.name} <span class="tag-count">({=tag.count})</span>
  </a>
  {/for}
</div>
{#else}
<p>No tags found yet.</p>
{/if}
